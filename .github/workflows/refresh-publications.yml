# Refreshes src/data/publications.json from PubMed once a month
# and commits it if anything changed. "Deploy site" then republishes.
name: Refresh publications

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run publications
      # Make sure the new list still builds before committing it.
      - run: npm run build
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/publications.json; then
            echo "No new publications."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/publications.json
          git commit -m 'Refresh publications from PubMed'
          git push
